<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FADE Pods — Mengarahkan Portal...</title>
  <script src="assets/js/data/synthetic-seed.js"></script>
  <script src="assets/js/store.js"></script>
</head>
<body style="background:#0D0D0E;color:#F5F5F5;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
  <p style="font-size:13px;color:#B5B5B8;">Mengarahkan ke portal sesuai sesi aktif...</p>
  <script>
    (function () {
      FADE_STORE.init();
      var session = FADE_STORE.getActiveSession();
      var hash = window.location.hash || '#dashboard';
      if (session && session.role === 'admin') {
        window.location.replace('admin.html' + hash);
      } else if (session && session.role === 'sales') {
        window.location.replace('sales.html' + hash);
      } else {
        window.location.replace('index.html');
      }
    })();
  </script>
</body>
</html>
